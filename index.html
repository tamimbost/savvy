<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Message for Savvy ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(-45deg, #ff9a9e, #fecfef, #fecfef, #ff9a9e);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            text-align: center;
            max-width: 800px;
            padding: 2rem;
            position: relative;
        }

        .hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .heart {
            position: absolute;
            color: #ff69b4;
            font-size: 20px;
            animation: float 6s ease-in-out infinite;
            opacity: 0.7;
        }

        @keyframes float {
            0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.7; }
            90% { opacity: 0.7; }
            100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
        }

        .initial-message {
            z-index: 10;
            position: relative;
        }

        .title {
            font-size: 3.5rem;
            color: #d63384;
            margin-bottom: 2rem;
            animation: titleGlow 2s ease-in-out infinite alternate;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        @keyframes titleGlow {
            from { text-shadow: 2px 2px 4px rgba(0,0,0,0.3), 0 0 20px #ff69b4; }
            to { text-shadow: 2px 2px 4px rgba(0,0,0,0.3), 0 0 30px #ff1493, 0 0 40px #ff1493; }
        }

        .emotional-text {
            font-size: 1.5rem;
            color: #6f42c1;
            line-height: 1.8;
            margin-bottom: 3rem;
            animation: fadeInUp 1s ease-out;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .click-to-continue {
            background: linear-gradient(45deg, #ff6b6b, #ff8e8e);
            color: white;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .click-to-continue:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.6);
        }

        .proposal-section {
            display: none;
            animation: slideInFromBottom 1s ease-out;
        }

        @keyframes slideInFromBottom {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .proposal-text {
            font-size: 2.5rem;
            color: #d63384;
            margin-bottom: 2rem;
            animation: heartbeat 1.5s ease-in-out infinite;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .buttons-container {
            display: flex;
            gap: 2rem;
            justify-content: center;
            margin-top: 2rem;
        }

        .proposal-btn {
            padding: 1rem 2rem;
            font-size: 1.3rem;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            min-width: 120px;
        }

        .yes-btn {
            background: linear-gradient(45deg, #28a745, #20c997);
            color: white;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
        }

        .yes-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 6px 20px rgba(40, 167, 69, 0.6);
        }

        .no-btn {
            background: linear-gradient(45deg, #dc3545, #fd7e14);
            color: white;
            box-shadow: 0 4px 15px rgba(220, 53, 69, 0.4);
        }

        .no-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 6px 20px rgba(220, 53, 69, 0.6);
        }

        .response-section {
            display: none;
            margin-top: 2rem;
        }

        .love-message {
            font-size: 3rem;
            color: #28a745;
            animation: celebrationBounce 0.6s ease-in-out;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        @keyframes celebrationBounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-30px); }
            60% { transform: translateY(-15px); }
        }

        .sad-message {
            font-size: 4rem;
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .fireworks {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }

        .firework {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #ff69b4;
            border-radius: 50%;
            animation: fireworkExplode 1s ease-out forwards;
        }

        @keyframes fireworkExplode {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(20); opacity: 0; }
        }

        @media (max-width: 768px) {
            .title { font-size: 2.5rem; }
            .emotional-text { font-size: 1.2rem; }
            .proposal-text { font-size: 2rem; }
            .buttons-container { flex-direction: column; align-items: center; }
        }
    </style>
</head>
<body>
    <div class="hearts" id="hearts"></div>
    
    <div class="container">
        <div class="initial-message" id="initialMessage">
            <h1 class="title">Dear Savvy ❤️</h1>
            <div class="emotional-text">
                Every moment with you feels like a beautiful dream...<br>
                Your smile lights up my world in ways I never imagined possible.<br>
                You are the melody to my heart's song,<br>
                the sunshine that brightens my darkest days.<br>
                I have something very special to ask you...
            </div>
            <button class="click-to-continue" onclick="showProposal()">
                Click to Continue ✨
            </button>
        </div>

        <div class="proposal-section" id="proposalSection">
            <div class="proposal-text">
                Will you marry me, Savvy? 💍
            </div>
            <div class="buttons-container">
                <button class="proposal-btn yes-btn" onclick="handleYes()">
                    Yes! 💕
                </button>
                <button class="proposal-btn no-btn" onclick="handleNo()">
                    No 💔
                </button>
            </div>
        </div>

        <div class="response-section" id="responseSection">
            <div id="responseMessage"></div>
        </div>
    </div>

    <div class="fireworks" id="fireworks"></div>

    <script>
        // Create floating hearts
        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + '%';
            heart.style.animationDelay = Math.random() * 6 + 's';
            heart.style.animationDuration = (Math.random() * 3 + 6) + 's';
            document.getElementById('hearts').appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 9000);
        }

        // Create hearts continuously
        setInterval(createHeart, 800);

        function showProposal() {
            const initialMessage = document.getElementById('initialMessage');
            const proposalSection = document.getElementById('proposalSection');
            
            initialMessage.style.animation = 'fadeInUp 0.5s ease-out reverse';
            
            setTimeout(() => {
                initialMessage.style.display = 'none';
                proposalSection.style.display = 'block';
            }, 500);
        }

        function handleYes() {
            const proposalSection = document.getElementById('proposalSection');
            const responseSection = document.getElementById('responseSection');
            const responseMessage = document.getElementById('responseMessage');
            
            proposalSection.style.display = 'none';
            responseSection.style.display = 'block';
            
            responseMessage.innerHTML = '<div class="love-message">I LOVE YOU TOO! 💕✨🎉</div>';
            
            // Create fireworks effect
            createFireworks();
            
            // Change background to celebration colors
            document.body.style.background = 'linear-gradient(-45deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4, #ffeaa7, #dda0dd)';
            document.body.style.backgroundSize = '400% 400%';
        }

        function handleNo() {
            const proposalSection = document.getElementById('proposalSection');
            const responseSection = document.getElementById('responseSection');
            const responseMessage = document.getElementById('responseMessage');
            
            proposalSection.style.display = 'none';
            responseSection.style.display = 'block';
            
            responseMessage.innerHTML = '<div class="sad-message">😭😢💔😿😭</div>';
            
            // Change background to sad colors
            document.body.style.background = 'linear-gradient(-45deg, #74b9ff, #0984e3, #74b9ff, #0984e3)';
            document.body.style.backgroundSize = '400% 400%';
        }

        function createFireworks() {
            const fireworksContainer = document.getElementById('fireworks');
            const colors = ['#ff69b4', '#ff1493', '#ffd700', '#00ff00', '#00bfff', '#ff4500'];
            
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const firework = document.createElement('div');
                    firework.className = 'firework';
                    firework.style.left = Math.random() * 100 + '%';
                    firework.style.top = Math.random() * 100 + '%';
                    firework.style.background = colors[Math.floor(Math.random() * colors.length)];
                    firework.style.animationDelay = Math.random() * 0.5 + 's';
                    
                    fireworksContainer.appendChild(firework);
                    
                    setTimeout(() => {
                        firework.remove();
                    }, 1000);
                }, i * 100);
            }
        }

        // Add some sparkle effects
        function createSparkle() {
            const sparkle = document.createElement('div');
            sparkle.innerHTML = '✨';
            sparkle.style.position = 'fixed';
            sparkle.style.left = Math.random() * 100 + '%';
            sparkle.style.top = Math.random() * 100 + '%';
            sparkle.style.pointerEvents = 'none';
            sparkle.style.animation = 'fadeInUp 2s ease-out forwards';
            sparkle.style.zIndex = '999';
            sparkle.style.fontSize = '1.5rem';
            
            document.body.appendChild(sparkle);
            
            setTimeout(() => {
                sparkle.remove();
            }, 2000);
        }

        setInterval(createSparkle, 1500);
    </script>
</body>
</html>
